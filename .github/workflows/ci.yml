name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  backend-test:
    name: Backend – lint, migrate & test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: datasense_ci
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci_password
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    defaults:
      run:
        working-directory: services/api
    env:
      GOOGLE_API_KEY: ""
      ENVIRONMENT: test
      DATABASE_URL: postgresql+psycopg://ci_user:ci_password@localhost:5432/datasense_ci
      JWT_SECRET_KEY: ci-ephemeral-secret-key-at-least-32-chars-long
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check app tests
      - name: Verify Alembic migrations against PostgreSQL
        run: alembic upgrade head
      - name: Run pytest suite (offline, zero Gemini calls)
        run: pytest -v

  frontend-test:
    name: Frontend – type-check, lint, test & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Type check
        run: npm run type-check
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test -- --run
      - name: Production build
        run: npm run build
      - name: Dependency audit (high/critical check)
        run: npm audit --audit-level=critical || true

  docker-verify:
    name: Docker – Compose config & container build check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose configuration
        run: docker compose -f deployment/compose/docker-compose.yml config >/dev/null
      - name: Build API container image
        run: docker build -f deployment/docker/backend.Dockerfile -t datasense-api:ci .
      - name: Build Web container image
        run: docker build -f deployment/docker/frontend.Dockerfile -t datasense-web:ci .
