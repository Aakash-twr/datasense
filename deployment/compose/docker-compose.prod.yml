services:
  postgres:
    image: postgres:16-alpine
    restart: always
    env_file:
      - path: ../../.env.production
        required: false
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-datasense}
      POSTGRES_USER: ${POSTGRES_USER:-datasense_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in production}
    volumes:
      - datasense_prod_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 768m

  api:
    build:
      context: ../..
      dockerfile: deployment/docker/backend.Dockerfile
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - path: ../../.env.production
        required: false
    environment:
      ENVIRONMENT: production
      DEBUG: "false"
      COOKIE_SECURE: "true"
      STRUCTURED_LOGGING: "true"
    volumes:
      - datasense_prod_storage:/var/lib/datasense/storage
    expose:
      - "8000"
    mem_limit: 2g

  web:
    build:
      context: ../..
      dockerfile: deployment/docker/frontend.Dockerfile
    restart: always
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-80}:80"
    mem_limit: 256m

volumes:
  datasense_prod_pgdata:
  datasense_prod_storage:
