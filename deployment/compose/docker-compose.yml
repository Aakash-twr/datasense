services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-datasense}
      POSTGRES_USER: ${POSTGRES_USER:-datasense_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-datasense_local_dev_pw}
    volumes:
      - datasense_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 512m

  api:
    build:
      context: ../..
      dockerfile: deployment/docker/backend.Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-datasense_user}:${POSTGRES_PASSWORD:-datasense_local_dev_pw}@postgres:5432/${POSTGRES_DB:-datasense}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-local-dev-jwt-secret-key-change-for-production}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8080}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080,http://localhost:5173}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash}
      DUCKDB_MEMORY_LIMIT: ${DUCKDB_MEMORY_LIMIT:-512MB}
      DUCKDB_THREADS: ${DUCKDB_THREADS:-2}
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-1}
      STRUCTURED_LOGGING: ${STRUCTURED_LOGGING:-true}
    volumes:
      - datasense_storage:/var/lib/datasense/storage
    ports:
      - "8000:8000"
    mem_limit: 2g

  web:
    build:
      context: ../..
      dockerfile: deployment/docker/frontend.Dockerfile
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8080:80"
    mem_limit: 256m

volumes:
  datasense_pgdata:
  datasense_storage:
